<!doctype html>
<html>
<body>
<table>
<tbody>
<!-- A student-visit row carries a Name and must be filtered OUT. -->
<tr class="lrow rowOdd">
  <td class="lcell" data-field="isWork"></td>
  <td class="lcell" data-field="Name" style="font-size: 12px;">Some Student</td>
  <td class="lcell" data-field="Time" style="font-size: 12px;">Jul 06, 2026,&nbsp; 1200<small>p</small></td>
  <td class="lcell" data-field="Dur" style="display: none;">2<small>h</small></td>
</tr>

<!-- Billable work rows have an empty Name and must be kept. -->
<tr class="lrow rowEven">
  <td class="lcell" data-field="isWork"></td>
  <td class="lcell" data-field="Name"></td>
  <td class="lcell" data-field="Time" style="font-size: 12px;">Jul 06, 2026,&nbsp; 1200<small>p</small></td>
  <td class="lcell" data-field="Dur" style="display: none;">2<small>h</small></td>
</tr>

<tr class="lrow rowOdd">
  <td class="lcell" data-field="isWork"></td>
  <td class="lcell" data-field="Name"></td>
  <td class="lcell" data-field="Time" style="font-size: 12px;">Jul 09, 2026,&nbsp; 1<small>42p</small></td>
  <td class="lcell" data-field="Dur" style="display: none;">1<small>h</small> 11<small>m</small></td>
</tr>

<tr class="lrow rowEven">
  <td class="lcell" data-field="isWork"></td>
  <td class="lcell" data-field="Name"></td>
  <td class="lcell" data-field="Time" style="font-size: 12px;">Jul 11, 2026,&nbsp; 9<small>00a</small></td>
  <td class="lcell" data-field="Dur" style="display: none;">3<small>h</small></td>
</tr>

<!-- Outside the tested date range; used to check filtering. -->
<tr class="lrow rowOdd">
  <td class="lcell" data-field="isWork"></td>
  <td class="lcell" data-field="Name"></td>
  <td class="lcell" data-field="Time" style="font-size: 12px;">Jul 20, 2026,&nbsp; 2<small>00p</small></td>
  <td class="lcell" data-field="Dur" style="display: none;">1<small>h</small></td>
</tr>
</tbody>
</table>
</body>
</html>
